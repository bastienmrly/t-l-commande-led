<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test Ultime KS03~F400C1</title>
  <style>
    body { font-family: -apple-system, sans-serif; background: #121212; color: #fff; text-align: center; padding: 20px; max-width: 400px; margin: 0 auto; }
    .card { background: #1e1e1e; padding: 18px; border-radius: 16px; margin-bottom: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
    .btn { padding: 15px; margin: 6px 0; font-size: 16px; border: none; border-radius: 12px; cursor: pointer; color: white; font-weight: bold; width: 100%; box-sizing: border-box; }
    .btn-connect { background-color: #007aff; font-size: 18px; color: #fff; }
    .btn-on { background-color: #2ec4b6; width: 48%; display: inline-block; }
    .btn-off { background-color: #e71d36; width: 48%; display: inline-block; }
    #status { margin-top: 10px; font-weight: bold; font-size: 15px; color: #ff9f1c; }
    #logs { background: #000; color: #00ff00; font-family: monospace; font-size: 11px; text-align: left; padding: 10px; border-radius: 8px; height: 150px; overflow-y: auto; margin-top: 15px; }
    .color-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 10px; }
    .color-btn { height: 45px; border-radius: 10px; border: 2px solid #333; cursor: pointer; }
    .row { display: flex; justify-content: space-between; }
  </style>
</head>
<body>

  <h2>💡 Test Ultime KS03~F400C1</h2>

  <div class="card">
    <button class="btn btn-connect" onclick="connectKS03()">🔗 Connecter KS03~F400C1</button>
    <div id="status">Statut : Non connecté</div>
  </div>

  <div class="card">
    <div class="row">
      <button class="btn btn-on" onclick="sendPower(true)">ALLUMER</button>
      <button class="btn btn-off" onclick="sendPower(false)">ÉTEINDRE</button>
    </div>
  </div>

  <div class="card">
    <h3>🎨 Test Couleurs</h3>
    <div class="color-grid">
      <div class="color-btn" style="background: #ff0000;" onclick="sendColor(255, 0, 0)"></div>
      <div class="color-btn" style="background: #00ff00;" onclick="sendColor(0, 255, 0)"></div>
      <div class="color-btn" style="background: #0000ff;" onclick="sendColor(0, 0, 255)"></div>
      <div class="color-btn" style="background: #ffffff;" onclick="sendColor(255, 255, 255)"></div>
    </div>
  </div>

  <div class="card">
    <h3>📜 Console Logs</h3>
    <div id="logs">Prêt à tester le KS03...<br></div>
  </div>

  <script>
    let device = null;
    let writeChar = null;
    let notifyChar = null;
    let pingTimer = null;

    const statusDiv = document.getElementById('status');
    const logsDiv = document.getElementById('logs');

    function log(msg) {
      console.log(msg);
      logsDiv.innerHTML += `> ${msg}<br>`;
      logsDiv.scrollTop = logsDiv.scrollHeight;
    }

    async function connectKS03() {
      try {
        log("Recherche du KS03...");
        statusDiv.innerText = "🔍 Connexion en cours...";
        statusDiv.style.color = "#ff9f1c";

        device = await navigator.bluetooth.requestDevice({
          filters: [{ namePrefix: 'KS' }, { namePrefix: 'KS03' }],
          optionalServices: [
            '0000fff0-0000-1000-8000-00805f9b34fb',
            '0000ffe0-0000-1000-8000-00805f9b34fb',
            '0000ffd0-0000-1000-8000-00805f9b34fb'
          ]
        });

        device.addEventListener('gattserverdisconnected', () => {
          log("⚠️ DÉCONNEXION DÉTECTÉE !");
          statusDiv.innerText = "❌ Déconnecté par le ruban";
          statusDiv.style.color = "#e71d36";
          if (pingTimer) clearInterval(pingTimer);
        });

        log(`Appareil : ${device.name}`);
        const server = await device.gatt.connect();
        log("GATT Connecté ! Analyse des services...");

        const services = await server.getPrimaryServices();

        writeChar = null;
        notifyChar = null;

        for (const service of services) {
          log(`Service : ${service.uuid}`);
          try {
            const characteristics = await service.getCharacteristics();
            for (const c of characteristics) {
              log(` -> Char: ${c.uuid} [Write:${c.properties.write || c.properties.writeWithoutResponse}, Notify:${c.properties.notify}]`);

              // Caractéristique de notification (CRUCIAL pour verrouiller la connexion sous iOS)
              if (c.properties.notify || c.properties.indicate) {
                notifyChar = c;
              }

              // Caractéristique d'écriture
              if (c.properties.writeWithoutResponse || c.properties.write) {
                if (!writeChar || c.uuid.includes('fff3') || c.uuid.includes('ffe9')) {
                  writeChar = c;
                }
              }
            }
          } catch(e) {}
        }

        // Activation impérative des notifications pour empêcher la déconnexion après 2s
        if (notifyChar) {
          try {
            await notifyChar.startNotifications();
            log("✅ Notifications activées (Maintien iOS actif)");
          } catch(e) {
            log("⚠️ Échec activation notifications, suite...");
          }
        }

        if (writeChar) {
          log(`🎯 Caractéristique écriture : ${writeChar.uuid}`);
          statusDiv.innerText = `✅ Connecté : ${device.name}`;
          statusDiv.style.color = "#34c759";

          startKeepAlive();
        } else {
          throw new Error("Aucune caractéristique d'écriture trouvée.");
        }

      } catch (err) {
        log(`❌ Erreur : ${err.message}`);
        statusDiv.innerText = "❌ Échec connexion";
        statusDiv.style.color = "#e71d36";
      }
    }

    function startKeepAlive() {
      if (pingTimer) clearInterval(pingTimer);

      // Trame d'accroche KS03 initiale
      sendPayload([0xef, 0x01, 0x77]);

      // Signal de maintien
      pingTimer = setInterval(() => {
        if (device && device.gatt.connected && writeChar) {
          sendPayload([0xef, 0x01, 0x77]);
        } else {
          clearInterval(pingTimer);
        }
      }, 1000);
    }

    async function sendPayload(bytes) {
      if (!writeChar) return;
      try {
        const payload = new Uint8Array(bytes);
        if (writeChar.properties.writeWithoutResponse) {
          await writeChar.writeValueWithoutResponse(payload);
        } else {
          await writeChar.writeValue(payload);
        }
      } catch(e) {}
    }

    async function sendPower(state) {
      log(`Power ${state ? 'ON' : 'OFF'}`);
      // Envoie la trame Keepsmile standard + la trame BLEDOM au cas où
      await sendPayload([0xcc, state ? 0x23 : 0x24, 0x33]);
      await sendPayload([0x7e, 0x04, 0x04, state ? 0x01 : 0x00, 0x00, 0x00, 0xef]);
    }

    async function sendColor(r, g, b) {
      log(`Couleur R:${r} G:${g} B:${b}`);
      await sendPayload([0x56, r, g, b, 0x00, 0xf0, 0xaa]);
      await sendPayload([0x7e, 0x07, 0x05, 0x03, r, g, b, 0x10, 0xef]);
    }
  </script>
</body>
</html>
