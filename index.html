<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Télécommande Universal - LED & PC</title>
  <style>
    :root {
      --bg: #121212;
      --card: #1e1e1e;
      --accent: #ff9500;
      --green: #00d285;
      --red: #ff3b30;
      --text: #ffffff;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      padding: 15px;
      max-width: 500px;
      margin: 0 auto;
    }

    h2, h3 { text-align: center; margin-bottom: 15px; }

    .card {
      background: var(--card);
      padding: 15px;
      border-radius: 12px;
      margin-bottom: 20px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 15px;
    }

    button {
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      background: #2a2a2a;
      color: var(--text);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    button:active { transform: scale(0.98); }
    button.active { background: var(--accent); color: #000; }

    .btn-all {
      grid-column: span 2;
      background: #2c3e50;
      border: 1px solid #34495e;
    }

    .action-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .action-btn {
      padding: 18px;
      font-size: 16px;
      border-radius: 10px;
    }

    .btn-on { background: var(--green); color: #000; }
    .btn-off { background: var(--red); color: #fff; }
    
    .btn-reset {
      background: transparent;
      color: var(--accent);
      border: 1px dashed var(--accent);
      width: 100%;
      margin-top: 10px;
      font-size: 12px;
    }

    #status {
      margin: 10px 0;
      padding: 10px;
      border-radius: 6px;
      background: #181818;
      font-size: 13px;
      text-align: center;
      border: 1px solid #333;
    }

    input[type="text"] {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #333;
      background: #121212;
      color: var(--text);
      box-sizing: border-box;
      margin-bottom: 10px;
      font-size: 13px;
    }

    .btn-pc {
      width: 100%;
      background: var(--red);
      color: white;
      padding: 15px;
      font-size: 15px;
    }
  </style>
</head>
<body>

  <h2>💡 Contrôle Universal LED, Audio & PC</h2>

  <!-- SECTION LED -->
  <div class="card">
    <div style="font-size: 13px; margin-bottom: 10px; color: #aaa;">🚀 Sélectionnez la Zone LED :</div>
    
    <div class="grid">
      <button onclick="selectZone('chambre')" id="btn-chambre">🛏️ Chambre</button>
      <button onclick="selectZone('bureau')" id="btn-bureau">🖥️ Bureau</button>
      <button onclick="selectZone('meuble')" id="btn-meuble">🛋️ Meuble</button>
      <button onclick="selectZone('etage_arme')" id="btn-etage_arme">⚔️ Étage Arme</button>
      <button onclick="selectZone('etage_plante')" id="btn-etage_plante">🪴 Étage Plante</button>
      <button onclick="selectZone('etage_jeux')" id="btn-etage_jeux">🎮 Étage Jeux</button>
      <button onclick="selectZone('all')" id="btn-all" class="btn-all">🌐 TOUTES LES ZONES</button>
    </div>

    <div id="status">Sélectionnez une zone pour commencer</div>

    <button class="btn-reset" onclick="resetCurrentZone()">🔄 Dissocier / Re-scanner cette zone</button>

    <div class="action-grid" style="margin-top: 15px;">
      <button class="action-btn btn-on" onclick="sendPower(true)">ALLUMER</button>
      <button class="action-btn btn-off" onclick="sendPower(false)">ÉTEINDRE</button>
    </div>
  </div>

  <!-- SECTION ORDINATEUR -->
  <div class="card">
    <h3>🖥️ Contrôle Ordinateur</h3>
    <input type="text" id="ngrok-url" value="https://gnarly-ecosphere-cornbread.ngrok" placeholder="https://votre-url.ngrok-free.app">
    <button class="btn-pc" onclick="shutdownPC()">🛑 Éteindre le PC à distance</button>
  </div>

  <script>
    // UUIDs spécifiques LotusLamp / ELK-BLEDOM / Triones
    const SERVICE_UUID = '0000ffd0-0000-1000-8000-00805f9b34fb';
    const CHARACTERISTIC_UUID = '0000ffd1-0000-1000-8000-00805f9b34fb';

    // Trames officielles LotusLamp
    const CMD_ON = new Uint8Array([0x7e, 0x07, 0x05, 0x03, 0xff, 0xff, 0xff, 0x00, 0xef]);
    const CMD_OFF = new Uint8Array([0x7e, 0x04, 0x04, 0x00, 0x00, 0x00, 0x00, 0x00, 0xef]);

    const ZONES = ['chambre', 'bureau', 'meuble', 'etage_arme', 'etage_plante', 'etage_jeux'];
    let currentZone = null;
    let devices = {};
    let characteristics = {};

    function updateStatus(msg, isSuccess = true) {
      const statusEl = document.getElementById('status');
      statusEl.innerText = msg;
      statusEl.style.color = isSuccess ? '#00d285' : '#ff3b30';
    }

    function selectZone(zone) {
      currentZone = zone;
      document.querySelectorAll('.grid button').forEach(b => b.classList.remove('active'));
      
      const selectedBtn = document.getElementById(`btn-${zone}`);
      if(selectedBtn) selectedBtn.classList.add('active');

      if (zone === 'all') {
        updateStatus("Mode TOUTES LES ZONES activé");
      } else if (characteristics[zone] && devices[zone]?.gatt.connected) {
        updateStatus(`Connecté : ${devices[zone].name || 'Ruban LED'} [${zone.toUpperCase()}]`);
      } else {
        updateStatus(`Zone ${zone.toUpperCase()} sélectionnée. Cliquez sur Allumer.`);
      }
    }

    async function connectZone(zone) {
      updateStatus(`Appairage de la zone ${zone.toUpperCase()}...`);
      try {
        const device = await navigator.bluetooth.requestDevice({
          acceptAllDevices: true,
          optionalServices: [SERVICE_UUID, 'ffd0']
        });

        updateStatus("Connexion GATT en cours...");
        const server = await device.gatt.connect();
        
        let service;
        try {
          service = await server.getPrimaryService(SERVICE_UUID);
        } catch(e) {
          service = await server.getPrimaryService('ffd0');
        }

        let characteristic;
        try {
          characteristic = await service.getCharacteristic(CHARACTERISTIC_UUID);
        } catch(e) {
          characteristic = await service.getCharacteristic('ffd1');
        }

        devices[zone] = device;
        characteristics[zone] = characteristic;

        updateStatus(`✅ Connecté : ${device.name || 'LED'} [${zone.toUpperCase()}]`);
        return characteristic;
      } catch (error) {
        console.error(error);
        updateStatus(`❌ Erreur connexion : ${error.message}`, false);
        return null;
      }
    }

    async function sendPower(state) {
      if (!currentZone) {
        alert("Veuillez d'abord sélectionner une zone !");
        return;
      }

      const targets = currentZone === 'all' ? ZONES : [currentZone];

      for (const zone of targets) {
        // En mode "ALL", on ignore les zones qui ne sont pas encore configurées
        if (currentZone === 'all' && !characteristics[zone]) continue;

        let char = characteristics[zone];

        if (!char || !devices[zone]?.gatt.connected) {
          char = await connectZone(zone);
        }

        if (char) {
          try {
            const command = state ? CMD_ON : CMD_OFF;
            await char.writeValue(command);
            updateStatus(state ? `💡 ${zone.toUpperCase()} Allumé` : `🌙 ${zone.toUpperCase()} Éteint`);
          } catch (error) {
            console.error(error);
            updateStatus(`❌ Échec envoi sur ${zone}`, false);
          }
        }
        // Micro-pause pour éviter la saturation du contrôleur Bluetooth iOS
        await new Promise(r => setTimeout(r, 200));
      }
    }

    function resetCurrentZone() {
      if (!currentZone || currentZone === 'all') return alert("Sélectionnez une zone précise à réinitialiser.");
      
      if (devices[currentZone] && devices[currentZone].gatt.connected) {
        devices[currentZone].gatt.disconnect();
      }
      delete devices[currentZone];
      delete characteristics[currentZone];
      
      const btn = document.getElementById(`btn-${currentZone}`);
      if(btn) btn.classList.remove('active');
      
      updateStatus(`Zone ${currentZone.toUpperCase()} réinitialisée. Cliquez pour ré-appairer.`);
    }

    // FONCTION PC (NGROK)
    async function shutdownPC() {
      const url = document.getElementById('ngrok-url').value.trim();
      if (!url) return alert("Veuillez saisir votre URL Ngrok !");

      if (confirm("Voulez-vous vraiment éteindre l'ordinateur à distance ?")) {
        try {
          const response = await fetch(`${url}/shutdown`, { method: 'POST' });
          if (response.ok) {
            alert("🖥️ Ordre d'extinction envoyé avec succès !");
          } else {
            alert("⚠️ Erreur : Le serveur a répondu mais n'a pas pu éteindre le PC.");
          }
        } catch (error) {
          alert("❌ Impossible de joindre le serveur Ngrok. Vérifiez qu'il est bien lancé sur le PC.");
        }
      }
    }
  </script>
</body>
</html>
