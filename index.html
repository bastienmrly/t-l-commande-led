<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Télécommande LED Universal</title>
  <style>
    body { font-family: -apple-system, sans-serif; background: #121212; color: white; padding: 20px; text-align: center; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
    button { padding: 15px; border: none; border-radius: 8px; font-weight: bold; background: #2a2a2a; color: white; cursor: pointer; }
    button.active { background: #ff9500; color: black; }
    .action-btn { width: 100%; padding: 20px; margin-top: 10px; font-size: 18px; border-radius: 12px; }
    .btn-on { background: #00d285; color: black; }
    .btn-off { background: #ff3b30; color: white; }
    .btn-reset { background: transparent; color: #ff9500; border: 1px dashed #ff9500; margin-top: 10px; width: 100%; }
    #status { margin: 15px 0; padding: 10px; border-radius: 6px; background: #1e1e1e; font-size: 14px; }
  </style>
</head>
<body>

  <h2>💡 Contrôle Universal LED</h2>

  <div class="grid">
    <button onclick="selectZone('chambre')" id="btn-chambre">🛏️ Chambre</button>
    <button onclick="selectZone('bureau')" id="btn-bureau">🖥️ Bureau</button>
    <button onclick="selectZone('meuble')" id="btn-meuble">🛋️ Meuble</button>
    <button onclick="selectZone('etage_arme')" id="btn-etage_arme">⚔️ Étage Arme</button>
    <button onclick="selectZone('etage_plante')" id="btn-etage_plante">🪴 Étage Plante</button>
    <button onclick="selectZone('etage_jeux')" id="btn-etage_jeux">🎮 Étage Jeux</button>
  </div>

  <div id="status">Sélectionnez une zone</div>

  <button class="btn-reset" onclick="resetCurrentZone()">🔄 Dissocier / Re-scanner cette zone</button>

  <br><br>
  <button class="action-btn btn-on" onclick="sendPower(true)">ALLUMER</button>
  <button class="action-btn btn-off" onclick="sendPower(false)">ÉTEINDRE</button>

  <script>
    // UUIDs spécifiques aux contrôleurs LotusLamp / ELK-BLEDOM / Triones
    const SERVICE_UUID = '0000ffd0-0000-1000-8000-00805f9b34fb';
    const CHARACTERISTIC_UUID = '0000ffd1-0000-1000-8000-00805f9b34fb';

    // Trames officielles LotusLamp
    const CMD_ON = new Uint8Array([0x7e, 0x07, 0x05, 0x03, 0xff, 0xff, 0xff, 0x00, 0xef]);
    const CMD_OFF = new Uint8Array([0x7e, 0x04, 0x04, 0x00, 0x00, 0x00, 0x00, 0x00, 0xef]);

    let currentZone = null;
    let devices = {};
    let characteristics = {};

    function updateStatus(msg, isSuccess = true) {
      const statusEl = document.getElementById('status');
      statusEl.innerText = msg;
      statusEl.style.color = isSuccess ? '#00d285' : '#ff3b30';
    }

    function selectZone(zone) {
      currentZone = zone;
      document.querySelectorAll('.grid button').forEach(b => b.classList.remove('active'));
      document.getElementById(`btn-${zone}`).classList.add('active');

      if (characteristics[zone]) {
        updateStatus(`Connecté à la zone : ${zone.toUpperCase()}`);
      } else {
        updateStatus(`Zone ${zone.toUpperCase()} non associée. Cliquez sur Allumer pour scanner.`);
      }
    }

    async function connectZone(zone) {
      updateStatus("Recherche du ruban LED Bluetooth...");
      try {
        const device = await navigator.bluetooth.requestDevice({
          acceptAllDevices: true,
          optionalServices: [SERVICE_UUID, 'ffd0']
        });

        updateStatus("Connexion en cours...");
        const server = await device.gatt.connect();
        
        // Recherche du service FFD0
        let service;
        try {
          service = await server.getPrimaryService(SERVICE_UUID);
        } catch(e) {
          service = await server.getPrimaryService('ffd0');
        }

        // Recherche de la caractéristique FFD1
        let characteristic;
        try {
          characteristic = await service.getCharacteristic(CHARACTERISTIC_UUID);
        } catch(e) {
          characteristic = await service.getCharacteristic('ffd1');
        }

        devices[zone] = device;
        characteristics[zone] = characteristic;

        updateStatus(`✅ Connecté : ${device.name || 'Ruban LED'} [${zone.toUpperCase()}]`);
        return characteristic;
      } catch (error) {
        console.error(error);
        updateStatus(`❌ Échec de connexion : ${error.message}`, false);
        return null;
      }
    }

    async function sendPower(state) {
      if (!currentZone) {
        alert("Veuillez sélectionner une zone !");
        return;
      }

      let characteristic = characteristics[currentZone];

      // Si la zone n'est pas encore connectée, on lance l'appairage
      if (!characteristic || !devices[currentZone]?.gatt.connected) {
        characteristic = await connectZone(currentZone);
      }

      if (characteristic) {
        try {
          const command = state ? CMD_ON : CMD_OFF;
          await characteristic.writeValue(command);
          updateStatus(state ? "💡 Ordre : ALLUMÉ" : "🌙 Ordre : ÉTEINT");
        } catch (error) {
          console.error(error);
          updateStatus("❌ Erreur lors de l'envoi de la commande", false);
        }
      }
    }

    function resetCurrentZone() {
      if (!currentZone) return alert("Sélectionnez une zone à réinitialiser.");
      if (devices[currentZone] && devices[currentZone].gatt.connected) {
        devices[currentZone].gatt.disconnect();
      }
      delete devices[currentZone];
      delete characteristics[currentZone];
      updateStatus(`Zone ${currentZone.toUpperCase()} réinitialisée. Associez à nouveau.`);
    }
  </script>
</body>
</html>
