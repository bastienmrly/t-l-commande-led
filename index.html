<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contrôle LED Bluetooth</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    .card {
      background: #1e293b;
      padding: 30px;
      border-radius: 24px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      width: 100%;
      max-width: 400px;
      text-align: center;
    }

    h1 {
      font-size: 1.5rem;
      margin-bottom: 20px;
      color: #38bdf8;
    }

    .status {
      font-size: 0.9rem;
      margin-bottom: 25px;
      padding: 8px 16px;
      border-radius: 20px;
      background: #334155;
      display: inline-block;
    }

    .status.connected {
      background: #059669;
      color: #fff;
    }

    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s ease;
      margin-bottom: 12px;
    }

    .btn-connect {
      background: #0284c7;
      color: white;
    }

    .btn-connect:active {
      background: #0369a1;
    }

    .btn-off {
      background: #ef4444;
      color: white;
    }

    .btn-off:active {
      background: #dc2626;
    }

    .color-section {
      margin-top: 20px;
      display: none;
    }

    .color-picker-container {
      margin: 20px 0;
    }

    input[type="color"] {
      -webkit-appearance: none;
      border: none;
      width: 100px;
      height: 100px;
      border-radius: 50%;
      cursor: pointer;
      background: none;
    }

    input[type="color"]::-webkit-color-swatch-wrapper {
      padding: 0;
    }

    input[type="color"]::-webkit-color-swatch {
      border: 4px solid #ffffff33;
      border-radius: 50%;
    }

    .preset-colors {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-top: 15px;
    }

    .color-btn {
      height: 45px;
      border-radius: 10px;
      border: none;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>💡 Télécommande LED</h1>
    <div id="status" class="status">Déconnecté</div>

    <button id="btnConnect" class="btn btn-connect" onclick="connecterBluetooth()">Se connecter au Ruban</button>
    
    <div id="controls" class="color-section">
      <div class="color-picker-container">
        <input type="color" id="colorPicker" value="#ff0000" onchange="changerCouleur(this.value)">
      </div>

      <div class="preset-colors">
        <button class="color-btn" style="background: #ff0000;" onclick="changerCouleur('#ff0000')"></button>
        <button class="color-btn" style="background: #00ff00;" onclick="changerCouleur('#00ff00')"></button>
        <button class="color-btn" style="background: #0000ff;" onclick="changerCouleur('#0000ff')"></button>
        <button class="color-btn" style="background: #ffffff;" onclick="changerCouleur('#ffffff')"></button>
        <button class="color-btn" style="background: #ff00ff;" onclick="changerCouleur('#ff00ff')"></button>
        <button class="color-btn" style="background: #ffff00;" onclick="changerCouleur('#ffff00')"></button>
        <button class="color-btn" style="background: #00ffff;" onclick="changerCouleur('#00ffff')"></button>
        <button class="color-btn" style="background: #ff8000;" onclick="changerCouleur('#ff8000')"></button>
      </div>

      <br>
      <button class="btn btn-off" onclick="eteindre()">Éteindre</button>
    </div>
  </div>

  <script>
    let bluetoothDevice = null;
    let ledCharacteristic = null;

    // UUIDs universels standards (LotusLamp X / Triones / HappyLighting)
    const SERVICE_UUID = 0xffe0; 
    const CHARACTERISTIC_UUID = 0xffe1;

    async function connecterBluetooth() {
      const statusEl = document.getElementById('status');
      const controlsEl = document.getElementById('controls');
      const btnConnect = document.getElementById('btnConnect');

      try {
        statusEl.innerText = "Recherche en cours...";

        // Demande d'accès au périphérique Bluetooth
        bluetoothDevice = await navigator.bluetooth.requestDevice({
          acceptAllDevices: true,
          optionalServices: [SERVICE_UUID, 0xfff0, 0x7b0c]
        });

        statusEl.innerText = "Connexion...";
        const server = await bluetoothDevice.gatt.connect();
        
        // Recherche du service
        let service;
        try {
          service = await server.getPrimaryService(SERVICE_UUID);
        } catch(e) {
          // Fallback pour certains boîtiers génériques
          service = await server.getPrimaryService(0xfff0);
        }

        // Recherche de la caractéristique de commande
        try {
          ledCharacteristic = await service.getCharacteristic(CHARACTERISTIC_UUID);
        } catch(e) {
          ledCharacteristic = await service.getCharacteristic(0xfff1);
        }

        statusEl.innerText = "Connecté : " + bluetoothDevice.name;
        statusEl.classList.add('connected');
        controlsEl.style.display = 'block';
        btnConnect.style.display = 'none';

        bluetoothDevice.addEventListener('gattserverdisconnected', onDisconnected);

      } catch (error) {
        console.error(error);
        statusEl.innerText = "Erreur de connexion";
        alert("Impossible de se connecter : " + error.message);
      }
    }

    function onDisconnected() {
      const statusEl = document.getElementById('status');
      const controlsEl = document.getElementById('controls');
      const btnConnect = document.getElementById('btnConnect');

      statusEl.innerText = "Déconnecté";
      statusEl.classList.remove('connected');
      controlsEl.style.display = 'none';
      btnConnect.style.display = 'block';
    }

    async function envoyerCommande(r, g, b) {
      if (!ledCharacteristic) return;

      // Trame standard LotusLamp / HappyLighting : [0x7b, 0x04, 0x04, R, G, B, 0x00, 0xff, 0xbf]
      // Alternative simplifiée Triones : [0xfa, 0x23, R, G, B, 0x00, 0x05]
      const data = new Uint8Array([0x7b, 0x04, 0x04, r, g, b, 0x00, 0xff, 0xbf]);

      try {
        await ledCharacteristic.writeValueWithoutResponse(data);
      } catch (error) {
        // Tentative de secours avec écriture standard si writeValueWithoutResponse échoue
        try {
          await ledCharacteristic.writeValue(data);
        } catch (err) {
          console.error("Erreur d'envoi :", err);
        }
      }
    }

    function hexToRgb(hex) {
      const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
      return result ? {
        r: parseInt(result[1], 16),
        g: parseInt(result[2], 16),
        b: parseInt(result[3], 16)
      } : { r: 0, g: 0, b: 0 };
    }

    function changerCouleur(hexColor) {
      const rgb = hexToRgb(hexColor);
      envoyerCommande(rgb.r, rgb.g, rgb.b);
    }

    function eteindre() {
      envoyerCommande(0, 0, 0);
    }
  </script>
</body>
</html>
