<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Télécommande PC</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
        }
        h1 {
            margin-bottom: 30px;
        }
        .btn {
            width: 220px;
            padding: 15px;
            margin: 10px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s, background-color 0.2s;
        }
        .btn:active {
            transform: scale(0.95);
        }
        .btn-unlock {
            background-color: #007aff;
            color: white;
        }
        .btn-shutdown {
            background-color: #ff3b30;
            color: white;
        }
        #status {
            margin-top: 20px;
            font-size: 14px;
            color: #8e8e93;
        }
    </style>
</head>
<body>

    <h1>Télécommande PC</h1>

    <!-- Remplacez cette URL par votre lien Ngrok actuel -->
    <script>
        const NGROK_URL = "https://votre-adresse.ngrok-free.app";

        async function envoyerCommande(endpoint) {
            const statusDiv = document.getElementById("status");
            statusDiv.innerText = "Envoi de la commande...";
            
            try {
                const response = await fetch(`${NGROK_URL}/${endpoint}`, {
                    method: "POST"
                });
                const data = await response.json();
                statusDiv.innerText = data.message || "Commande exécutée !";
            } catch (error) {
                statusDiv.innerText = "Erreur de connexion au serveur.";
                console.error(error);
            }
        }
    </script>

    <button class="btn btn-unlock" onclick="envoyerCommande('unlock')">Déverrouiller</button>
    <button class="btn btn-shutdown" onclick="envoyerCommande('eteindre')">Éteindre</button>

    <div id="status"></div>

</body>
</html>
