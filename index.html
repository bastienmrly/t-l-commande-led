<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test Isolation Keepsmile (KS03)</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #121212; color: #fff; text-align: center; padding: 20px; max-width: 400px; margin: 0 auto; }
    .card { background: #1e1e1e; padding: 18px; border-radius: 16px; margin-bottom: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
    .btn { padding: 15px; margin: 6px 0; font-size: 16px; border: none; border-radius: 12px; cursor: pointer; color: white; font-weight: bold; width: 100%; box-sizing: border-box; }
    .btn-connect { background-color: #007aff; font-size: 18px; }
    .btn-on { background-color: #2ec4b6; width: 48%; display: inline-block; }
    .btn-off { background-color: #e71d36; width: 48%; display: inline-block; }
    #status { margin-top: 10px; font-weight: bold; font-size: 15px; color: #ff9f1c; }
    #logs { background: #000; color: #00ff00; font-family: monospace; font-size: 11px; text-align: left; padding: 10px; border-radius: 8px; height: 120px; overflow-y: auto; margin-top: 15px; }
    .color-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 10px; }
    .color-btn { height: 45px; border-radius: 10px; border: 2px solid #333; cursor: pointer; }
    .row { display: flex; justify-content: space-between; }
  </style>
</head>
<body>

  <h2>🧪 Test Keepsmile KS03</h2>

  <div class="card">
    <button class="btn btn-connect" onclick="connectKS03()">🔗 Se connecter au KS03</button>
    <div id="status">Statut : Non connecté</div>
  </div>

  <div class="card">
    <div class="row">
      <button class="btn btn-on" onclick="sendPower(true)">ALLUMER</button>
      <button class="btn btn-off" onclick="sendPower(false)">ÉTEINDRE</button>
    </div>
  </div>

  <div class="card">
    <h3>🎨 Test Couleurs</h3>
    <div class="color-grid">
      <div class="color-btn" style="background: #ff0000;" onclick="sendColor(255, 0, 0)"></div>
      <div class="color-btn" style="background: #00ff00;" onclick="sendColor(0, 255, 0)"></div>
      <div class="color-btn" style="background: #0000ff;" onclick="sendColor(0, 0, 255)"></div>
      <div class="color-btn" style="background: #ffffff;" onclick="sendColor(255, 255, 255)"></div>
    </div>
  </div>

  <div class="card">
    <h3>📜 Console de Debug</h3>
    <div id="logs">Prêt à tester...<br></div>
  </div>

  <script>
    let device = null;
    let writeChar = null;
    let keepAliveInterval = null;

    const statusDiv = document.getElementById('status');
    const logsDiv = document.getElementById('logs');

    function log(msg) {
      console.log(msg);
      logsDiv.innerHTML += `> ${msg}<br>`;
      logsDiv.scrollTop = logsDiv.scrollHeight;
    }

    async function connectKS03() {
      try {
        log("Recherche du KS03...");
        statusDiv.innerText = "🔍 Recherche en cours...";
        statusDiv.style.color = "#ff9f1c";

        // Demande d'accès très large spécifiquement pour Bluefy
        device = await navigator.bluetooth.requestDevice({
          acceptAllDevices: true,
          optionalServices: [
            '0000fff0-0000-1000-8000-00805f9b34fb',
            '0000ffe0-0000-1000-8000-00805f9b34fb',
            '0000ffd0-0000-1000-8000-00805f9b34fb',
            '0000ff00-0000-1000-8000-00805f9b34fb'
          ]
        });

        device.addEventListener('gattserverdisconnected', onDisconnected);

        log(`Appareil sélectionné : ${device.name || 'Inconnu'}`);
        log("Connexion au serveur GATT...");
        const server = await device.gatt.connect();

        log("Analyse des services...");
        const services = await server.getPrimaryServices();
        log(`${services.length} service(s) trouvé(s)`);

        writeChar = null;

        // Parcours complet pour trouver la meilleure caractéristique d'écriture
        for (const service of services) {
          log(`Analyse service : ${service.uuid}`);
          try {
            const characteristics = await service.getCharacteristics();
            for (const c of characteristics) {
              log(` -> Caractéristique : ${c.uuid} [W:${c.properties.write}, WNoResp:${c.properties.writeWithoutResponse}, Notify:${c.properties.notify}]`);

              // Tenter de s'abonner aux notifications si possible (indispensable sur certaines puces KS03)
              if (c.properties.notify || c.properties.indicate) {
                try {
                  await c.startNotifications();
                  log(`    -> Notifications activées sur ${c.uuid}`);
                } catch(e) {}
              }

              // Priorité aux caractéristiques d'écriture
              if (c.properties.writeWithoutResponse || c.properties.write) {
                if (!writeChar || c.uuid.includes('fff3') || c.uuid.includes('ffe9')) {
                  writeChar = c;
                }
              }
            }
          } catch(e) {
            log(` Erreur lecture service : ${e.message}`);
          }
        }

        if (writeChar) {
          log(`✅ Caractéristique d'écriture retenue : ${writeChar.uuid}`);
          statusDiv.innerText = `✅ Connecté : ${device.name || 'KS03'}`;
          statusDiv.style.color = "#34c759";

          // Lancement immédiat du maintien de connexion (Ping/Keep-Alive)
          startKeepAlive();
        } else {
          throw new Error("Aucune caractéristique d'écriture trouvée.");
        }

      } catch (err) {
        log(`❌ Erreur : ${err.message}`);
        statusDiv.innerText = "❌ Échec de connexion";
        statusDiv.style.color = "#e71d36";
      }
    }

    function startKeepAlive() {
      if (keepAliveInterval) clearInterval(keepAliveInterval);

      log("⚡ Envoi de la trame initiale d'accroche...");
      // Envoi direct de la commande Keep-Alive
      sendRawBytes([0xef, 0x01, 0x77]);

      // Envoie un signal toutes les 1.2 secondes pour empêcher l'iPhone/Bluefy de fermer le canal
      keepAliveInterval = setInterval(() => {
        if (device && device.gatt.connected && writeChar) {
          sendRawBytes([0xef, 0x01, 0x77]);
        } else {
          clearInterval(keepAliveInterval);
        }
      }, 1200);
    }

    async function sendRawBytes(bytes) {
      if (!writeChar) return;
      const data = new Uint8Array(bytes);
      try {
        if (writeChar.properties.writeWithoutResponse) {
          await writeChar.writeValueWithoutResponse(data);
        } else {
          await writeChar.writeValue(data);
        }
      } catch (e) {
        // En cas d'échec silencieux
      }
    }

    function onDisconnected() {
      log("⚠️ Déconnexion détectée par l'appareil !");
      statusDiv.innerText = "⚠️ Déconnecté !";
      statusDiv.style.color = "#ff9f1c";
      if (keepAliveInterval) clearInterval(keepAliveInterval);
    }

    async function sendPower(state) {
      log(`Commande Power : ${state ? 'ON' : 'OFF'}`);
      // Protocole trame Keepsmile : [0xCC, 0x23 (ON) / 0x24 (OFF), 0x33]
      await sendRawBytes([0xcc, state ? 0x23 : 0x24, 0x33]);
    }

    async function sendColor(r, g, b) {
      log(`Commande Couleur : R=${r} G=${g} B=${b}`);
      // Protocole couleur Keepsmile : [0x56, R, G, B, 0x00, 0xF0, 0xAA]
      await sendRawBytes([0x56, r, g, b, 0x00, 0xf0, 0xaa]);
    }
  </script>
</body>
</html>
