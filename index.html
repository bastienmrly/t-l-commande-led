<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Télécommande LED iOS - Permanent</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #121212; color: #fff; text-align: center; padding: 20px; max-width: 400px; margin: 0 auto; }
    .card { background: #1e1e1e; padding: 18px; border-radius: 16px; margin-bottom: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
    .btn { padding: 15px; margin: 6px 0; font-size: 16px; border: none; border-radius: 12px; cursor: pointer; color: white; font-weight: bold; width: 100%; box-sizing: border-box; }
    .btn-connect { background-color: #ff9f1c; color: #000; }
    .btn-on { background-color: #2ec4b6; width: 48%; display: inline-block; }
    .btn-off { background-color: #e71d36; width: 48%; display: inline-block; }
    .btn-gaming { background: linear-gradient(135deg, #8a2be2, #00d2ff); }
    .btn-work { background: linear-gradient(135deg, #e0e0e0, #8e9eab); color: #000; }
    .btn-sleep { background: linear-gradient(135deg, #4a0000, #1a0000); border: 1px solid #ff3b30; }
    .btn-effect { background-color: #3a3a3c; font-size: 14px; padding: 12px; }
    .btn-timer { background-color: #ff9500; font-size: 14px; padding: 12px; width: 31%; display: inline-block; }
    .btn-zone { background-color: #2c2c2e; border: 2px solid #3a3a3c; padding: 12px; font-size: 14px; width: 48%; display: inline-block; margin-bottom: 8px; color: #fff; font-weight: bold; }
    .btn-zone.active { border-color: #ff9f1c; background-color: #ff9f1c; color: #000; }
    #status { margin-top: 10px; font-weight: bold; font-size: 14px; color: #ff9f1c; }
    .row { display: flex; justify-content: space-between; margin-bottom: 6px; flex-wrap: wrap; }
    h3 { margin-top: 5px; margin-bottom: 12px; font-size: 16px; color: #aaa; text-align: left; }
    .color-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 10px; }
    .color-btn { height: 45px; border-radius: 10px; border: 2px solid #333; cursor: pointer; }
  </style>
</head>
<body>
  <h2>💡 Télécommande LED Directe</h2>

  <div class="card">
    <h3>🎯 Sélectionnez la Zone</h3>
    <div class="row">
      <button id="zone-chambre" class="btn btn-zone" onclick="selectZone('chambre')">🛏️ Chambre</button>
      <button id="zone-bureau" class="btn btn-zone" onclick="selectZone('bureau')">🖥️ Bureau</button>
      <button id="zone-meuble" class="btn btn-zone" onclick="selectZone('meuble')">🛋️ Meuble</button>
      <button id="zone-all" class="btn btn-zone" onclick="selectZone('all')">🌐 TOUT</button>
    </div>
    <div id="status">Sélectionnez une zone</div>
  </div>

  <div class="card">
    <div class="row">
      <button class="btn btn-on" onclick="sendToCurrent(getPowerPayload(true))">ALLUMER</button>
      <button class="btn btn-off" onclick="sendToCurrent(getPowerPayload(false))">ÉTEINDRE</button>
    </div>
  </div>

  <div class="card">
    <h3>🎨 Couleurs Principales</h3>
    <div class="color-grid">
      <div class="color-btn" style="background: #ff0000;" onclick="sendToCurrent(getColorPayload(255, 0, 0))"></div>
      <div class="color-btn" style="background: #00ff00;" onclick="sendToCurrent(getColorPayload(0, 255, 0))"></div>
      <div class="color-btn" style="background: #0000ff;" onclick="sendToCurrent(getColorPayload(0, 0, 255))"></div>
      <div class="color-btn" style="background: #ffffff;" onclick="sendToCurrent(getColorPayload(255, 255, 255))"></div>
      <div class="color-btn" style="background: #ffff00;" onclick="sendToCurrent(getColorPayload(255, 255, 0))"></div>
      <div class="color-btn" style="background: #00ffff;" onclick="sendToCurrent(getColorPayload(0, 255, 255))"></div>
      <div class="color-btn" style="background: #ff00ff;" onclick="sendToCurrent(getColorPayload(255, 0, 255))"></div>
      <div class="color-btn" style="background: #ff7f00;" onclick="sendToCurrent(getColorPayload(255, 127, 0))"></div>
    </div>
  </div>

  <div class="card">
    <h3>☀️ Luminosité</h3>
    <input type="range" id="brightness" min="1" max="100" value="100" style="width:100%" onchange="sendToCurrent(getBrightnessPayload(this.value))">
  </div>

  <div class="card">
    <h3>⏱️ Minuteur Puce (Autonome)</h3>
    <div class="row">
      <button class="btn btn-timer" onclick="setTimerToCurrent(15)">15 Min</button>
      <button class="btn btn-timer" onclick="setTimerToCurrent(30)">30 Min</button>
      <button class="btn btn-timer" onclick="setTimerToCurrent(60)">1 Heure</button>
    </div>
  </div>

  <div class="card">
    <h3>🎭 Ambiances Rapides</h3>
    <button class="btn btn-gaming" onclick="sendToCurrent(getColorPayload(138, 43, 226))">🎮 Gaming</button>
    <button class="btn btn-work" onclick="sendToCurrent(getColorPayload(220, 235, 255))">💼 Travail</button>
    <button class="btn btn-sleep" onclick="sendToCurrent(getColorPayload(30, 0, 0))">🌙 Sommeil</button>
  </div>

  <div class="card">
    <h3>✨ Effets</h3>
    <div class="row">
      <button class="btn btn-effect" style="width: 48%;" onclick="sendToCurrent(getModePayload(0x87))">🌈 Fondu</button>
      <button class="btn btn-effect" style="width: 48%;" onclick="sendToCurrent(getModePayload(0x8b))">⚡ Strobe</button>
    </div>
  </div>

  <script>
    let savedDevices = { chambre: null, bureau: null, meuble: null };
    let savedCharacteristics = { chambre: null, bureau: null, meuble: null };
    let currentZone = null;
    const status = document.getElementById('status');

    // Connexion et maintien du lien actif
    async function selectZone(zone) {
      document.querySelectorAll('.btn-zone').forEach(btn => btn.classList.remove('active'));
      document.getElementById(`zone-${zone}`).classList.add('active');
      currentZone = zone;

      if (zone === 'all') {
        status.innerText = "🌐 Mode TOUT (Séquentiel)";
        status.style.color = "#ff9f1c";
        return;
      }

      // Si le ruban est déjà connecté et valide, on ne déconnecte pas !
      if (savedDevices[zone] && savedDevices[zone].gatt.connected && savedCharacteristics[zone]) {
        status.innerText = `✅ Connecté à ${zone.toUpperCase()} (Maintien actif)`;
        status.style.color = "#34c759";
        return;
      }

      try {
        if (!savedDevices[zone]) {
          status.innerText = `🔍 Choisissez le ruban ${zone.toUpperCase()}...`;
          savedDevices[zone] = await navigator.bluetooth.requestDevice({
            acceptAllDevices: true,
            optionalServices: [
              '0000fff0-0000-1000-8000-00805f9b34fb',
              '0000ffe0-0000-1000-8000-00805f9b34fb',
              '0000ffd0-0000-1000-8000-00805f9b34fb'
            ]
          });
        }

        status.innerText = `🔗 Connexion à ${zone.toUpperCase()}...`;
        const server = await savedDevices[zone].gatt.connect();
        const services = await server.getPrimaryServices();

        for (const service of services) {
          try {
            const characteristics = await service.getCharacteristics();
            for (const c of characteristics) {
              if (c.properties.write || c.properties.writeWithoutResponse) {
                savedCharacteristics[zone] = c;
                break;
              }
            }
          } catch(e) {}
          if (savedCharacteristics[zone]) break;
        }

        if (savedCharacteristics[zone]) {
          status.innerText = `✅ Connecté à ${zone.toUpperCase()} (Verrouillé)`;
          status.style.color = "#34c759";
        }
      } catch (e) {
        status.innerText = "❌ Connexion échouée";
        status.style.color = "#e71d36";
      }
    }

    async function writeData(char, bytes) {
      try {
        await char.writeValue(new Uint8Array(bytes));
      } catch(e) {
        await char.writeValueWithoutResponse(new Uint8Array(bytes));
      }
    }

    async function sendToCurrent(bytes) {
      if (!currentZone) {
        alert("Sélectionnez d'abord une zone !");
        return;
      }

      if (currentZone === 'all') {
        status.innerText = "⏳ Envoi à tous les rubans...";
        for (const zone of ['chambre', 'bureau', 'meuble']) {
          if (savedDevices[zone]) {
            try {
              if (!savedDevices[zone].gatt.connected) {
                await selectZone(zone);
              }
              if (savedCharacteristics[zone]) {
                await writeData(savedCharacteristics[zone], bytes);
              }
            } catch(e) {}
          }
        }
        status.innerText = "✅ Commande envoyée à TOUT";
      } else {
        // Envoi instantané sur la connexion conservée
        if (savedCharacteristics[currentZone] && savedDevices[currentZone].gatt.connected) {
          await writeData(savedCharacteristics[currentZone], bytes);
        } else {
          await selectZone(currentZone);
          if (savedCharacteristics[currentZone]) {
            await writeData(savedCharacteristics[currentZone], bytes);
          }
        }
      }
    }

    function getColorPayload(r, g, b) { return [0x7e, 0x07, 0x05, 0x03, r, g, b, 0x10, 0xef]; }
    function getPowerPayload(state) { return [0x7e, 0x04, 0x04, state ? 0x01 : 0x00, 0x00, 0x00, 0xef]; }
    function getBrightnessPayload(val) { return [0x7e, 0x04, 0x01, parseInt(val), 0x00, 0x00, 0xef]; }
    function getModePayload(modeByte) { return [0x7e, 0x05, 0x03, modeByte, 0x03, 0x00, 0xef]; }

    async function setTimerToCurrent(minutes) {
      const now = new Date();
      const future = new Date(now.getTime() + minutes * 60000);
      const h = future.getHours();
      const m = future.getMinutes();

      await sendToCurrent([0x7e, 0x07, 0x83, now.getHours(), now.getMinutes(), now.getSeconds(), now.getDay() === 0 ? 7 : now.getDay(), 0x00, 0xef]);
      await sendToCurrent([0x7e, 0x08, 0x82, h, m, 0x00, 0x00, 0x00, 0xef]);
      alert(`Minuteur de ${minutes} min appliqué !`);
    }
  </script>
</body>
</html>
