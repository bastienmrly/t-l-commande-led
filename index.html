<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Télécommande LED iOS</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #121212; color: #fff; text-align: center; padding: 20px; max-width: 400px; margin: 0 auto; }
    .card { background: #1e1e1e; padding: 18px; border-radius: 16px; margin-bottom: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
    .btn { padding: 15px; margin: 6px 0; font-size: 16px; border: none; border-radius: 12px; cursor: pointer; color: white; font-weight: bold; width: 100%; box-sizing: border-box; }
    .btn-connect { background-color: #ff9f1c; color: #000; }
    .btn-on { background-color: #2ec4b6; width: 48%; display: inline-block; }
    .btn-off { background-color: #e71d36; width: 48%; display: inline-block; }
    .btn-gaming { background: linear-gradient(135deg, #8a2be2, #00d2ff); }
    .btn-work { background: linear-gradient(135deg, #e0e0e0, #8e9eab); color: #000; }
    .btn-sleep { background: linear-gradient(135deg, #4a0000, #1a0000); border: 1px solid #ff3b30; }
    .btn-effect { background-color: #3a3a3c; font-size: 14px; padding: 12px; }
    .btn-timer { background-color: #ff9500; font-size: 14px; padding: 12px; width: 31%; display: inline-block; }
    #status { margin-top: 10px; font-weight: bold; font-size: 14px; color: #ff9f1c; }
    .row { display: flex; justify-content: space-between; margin-bottom: 6px; }
    h3 { margin-top: 5px; margin-bottom: 12px; font-size: 16px; color: #aaa; text-align: left; }
    
    /* Grille de couleurs fixes */
    .color-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 10px; }
    .color-btn { height: 45px; border-radius: 10px; border: 2px solid #333; cursor: pointer; }
  </style>
</head>
<body>
  <h2>💡 Télécommande LED Autonome</h2>

  <div class="card">
    <button class="btn btn-connect" onclick="connectBluetooth()">🔗 CONNECTER LE RUBAN</button>
    <div id="status">Déconnecté</div>
  </div>

  <div class="card">
    <div class="row">
      <button class="btn btn-on" onclick="sendPower(true)">ALLUMER</button>
      <button class="btn btn-off" onclick="sendPower(false)">ÉTEINDRE</button>
    </div>
  </div>

  <!-- Couleurs de base par boutons fixes -->
  <div class="card">
    <h3>🎨 Couleurs Principales</h3>
    <div class="color-grid">
      <div class="color-btn" style="background: #ff0000;" onclick="sendColor(255, 0, 0)"></div>
      <div class="color-btn" style="background: #00ff00;" onclick="sendColor(0, 255, 0)"></div>
      <div class="color-btn" style="background: #0000ff;" onclick="sendColor(0, 0, 255)"></div>
      <div class="color-btn" style="background: #ffffff;" onclick="sendColor(255, 255, 255)"></div>
      <div class="color-btn" style="background: #ffff00;" onclick="sendColor(255, 255, 0)"></div>
      <div class="color-btn" style="background: #00ffff;" onclick="sendColor(0, 255, 255)"></div>
      <div class="color-btn" style="background: #ff00ff;" onclick="sendColor(255, 0, 255)"></div>
      <div class="color-btn" style="background: #ff7f00;" onclick="sendColor(255, 127, 0)"></div>
    </div>
  </div>

  <div class="card">
    <h3>☀️ Luminosité</h3>
    <input type="range" id="brightness" min="1" max="100" value="100" style="width:100%" onchange="sendBrightness(this.value)">
  </div>

  <div class="card">
    <h3>⏱️ Minuteur d'Extinction</h3>
    <div class="row">
      <button class="btn btn-timer" onclick="setTimer(15)">15 Min</button>
      <button class="btn btn-timer" onclick="setTimer(30)">30 Min</button>
      <button class="btn btn-timer" onclick="setTimer(60)">1 Heure</button>
    </div>
  </div>

  <div class="card">
    <h3>🎭 Ambiances Rapides</h3>
    <button class="btn btn-gaming" onclick="sendColor(138, 43, 226)">🎮 Gaming (Mauve/Bleu)</button>
    <button class="btn btn-work" onclick="sendColor(220, 235, 255)">💼 Travail (Clair)</button>
    <button class="btn btn-sleep" onclick="sendColor(30, 0, 0)">🌙 Sommeil (Tamisé)</button>
  </div>

  <div class="card">
    <h3>✨ Effets</h3>
    <div class="row">
      <button class="btn btn-effect" style="width: 48%;" onclick="sendMode(0x87)">🌈 Fondu</button>
      <button class="btn btn-effect" style="width: 48%;" onclick="sendMode(0x8b)">⚡ Strobe</button>
    </div>
  </div>

  <script>
    let gattCharacteristic = null;
    let timerTimeout = null;

    async function connectBluetooth() {
      const status = document.getElementById('status');
      try {
        status.innerText = "🔍 Recherche...";
        
        const device = await navigator.bluetooth.requestDevice({
          acceptAllDevices: true,
          optionalServices: [
            '0000fff0-0000-1000-8000-00805f9b34fb',
            '0000ffe0-0000-1000-8000-00805f9b34fb',
            '0000ffd0-0000-1000-8000-00805f9b34fb',
            '00001800-0000-1000-8000-00805f9b34fb'
          ]
        });
        
        status.innerText = "🔗 Connexion...";
        const server = await device.gatt.connect();
        const services = await server.getPrimaryServices();
        
        for (const service of services) {
          try {
            const characteristics = await service.getCharacteristics();
            for (const c of characteristics) {
              if (c.properties.write || c.properties.writeWithoutResponse) {
                gattCharacteristic = c;
                break;
              }
            }
          } catch(e) {}
          if (gattCharacteristic) break;
        }

        if (gattCharacteristic) {
          status.innerText = "✅ Connecté";
          status.style.color = "#34c759";
        } else {
          status.innerText = "⚠️ Erreur canal";
        }
      } catch (error) {
        status.innerText = "❌ Connexion échouée";
        status.style.color = "#e71d36";
      }
    }

    async function sendPayload(bytes) {
      if (!gattCharacteristic) {
        alert("Veuillez d'abord vous connecter au Bluetooth !");
        return;
      }
      try {
        await gattCharacteristic.writeValue(new Uint8Array(bytes));
      } catch (e) {
        try {
          await gattCharacteristic.writeValueWithoutResponse(new Uint8Array(bytes));
        } catch(err) {
          console.error("Erreur d'envoi :", err);
        }
      }
    }

    function sendColor(r, g, b) {
      sendPayload([0x7e, 0x07, 0x05, 0x03, r, g, b, 0x10, 0xef]);
    }

    function sendPower(state) {
      sendPayload([0x7e, 0x04, 0x04, state ? 0x01 : 0x00, 0x00, 0x00, 0xef]);
    }

    function sendBrightness(val) {
      const b = parseInt(val);
      sendPayload([0x7e, 0x04, 0x01, b, 0x00, 0x00, 0xef]);
    }

    function sendMode(modeByte) {
      sendPayload([0x7e, 0x05, 0x03, modeByte, 0x03, 0x00, 0xef]);
    }

    function setTimer(minutes) {
      if (timerTimeout) clearTimeout(timerTimeout);
      const ms = minutes * 60 * 1000;
      timerTimeout = setTimeout(() => {
        sendPower(false);
        alert("Minuteur terminé : Ruban LED éteint.");
      }, ms);
      alert(`Minuteur programmé pour s'éteindre dans ${minutes} minutes ! (Gardez la page ouverte dans Bluefy)`);
    }
  </script>
</body>
</html>
