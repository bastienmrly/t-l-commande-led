<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Télécommande LED Multi-Marques</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #121212; color: #fff; text-align: center; padding: 20px; max-width: 400px; margin: 0 auto; }
    .card { background: #1e1e1e; padding: 18px; border-radius: 16px; margin-bottom: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
    .btn { padding: 15px; margin: 6px 0; font-size: 16px; border: none; border-radius: 12px; cursor: pointer; color: white; font-weight: bold; width: 100%; box-sizing: border-box; }
    .btn-on { background-color: #2ec4b6; width: 48%; display: inline-block; }
    .btn-off { background-color: #e71d36; width: 48%; display: inline-block; }
    .btn-timer { background-color: #ff9500; font-size: 15px; font-weight: bold; width: 100%; }
    .btn-cancel { background-color: #3a3a3c; font-size: 14px; margin-top: 8px; }
    .btn-zone { background-color: #2c2c2e; border: 2px solid #3a3a3c; padding: 12px; font-size: 13px; width: 48%; display: inline-block; margin-bottom: 8px; color: #fff; font-weight: bold; }
    .btn-zone.active { border-color: #ff9f1c; background-color: #ff9f1c; color: #000; }
    .btn-forget { background-color: transparent; border: 1px dashed #e71d36; color: #e71d36; font-size: 12px; padding: 6px 12px; border-radius: 8px; cursor: pointer; margin-top: 8px; display: none; }
    #status { margin-top: 10px; font-weight: bold; font-size: 14px; color: #ff9f1c; }
    #timer-display { font-size: 18px; color: #ff9f1c; font-weight: bold; margin-top: 10px; }
    .row { display: flex; justify-content: space-between; margin-bottom: 6px; flex-wrap: wrap; }
    h3 { margin-top: 5px; margin-bottom: 12px; font-size: 16px; color: #aaa; text-align: left; }
    .color-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 10px; }
    .color-btn { height: 45px; border-radius: 10px; border: 2px solid #333; cursor: pointer; }
    
    input[type="number"], input[type="time"] {
      width: 100%; padding: 12px; background: #2c2c2e; border: 1px solid #3a3a3c; color: #fff;
      font-size: 16px; border-radius: 10px; box-sizing: border-box; margin-bottom: 10px; text-align: center;
    }

    #night-overlay {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0, 0, 0, 0.96); display: none; flex-direction: column;
      justify-content: center; align-items: center; z-index: 9999; color: #444;
    }
    #night-overlay h2 { font-size: 20px; color: #333; }
    #night-overlay p { font-size: 14px; color: #222; margin-top: 10px; }
  </style>
</head>
<body>
  <h2>💡 Contrôle Universal LED</h2>

  <div class="card">
    <h3>🎯 Sélectionnez la Zone</h3>
    <div class="row">
      <button id="zone-chambre" class="btn btn-zone" onclick="selectZone('chambre')">🛏️ Chambre</button>
      <button id="zone-bureau" class="btn btn-zone" onclick="selectZone('bureau')">🖥️ Bureau</button>
      <button id="zone-meuble" class="btn btn-zone" onclick="selectZone('meuble')">🛋️ Meuble</button>
      <button id="zone-all" class="btn btn-zone" onclick="selectZone('all')">🌐 TOUT</button>
    </div>
    <div id="status">Sélectionnez une zone</div>
    <button id="forget-btn" class="btn-forget" onclick="forgetCurrentZone()">🔄 Dissocier / Re-scanner cette zone</button>
  </div>

  <div class="card">
    <div class="row">
      <button class="btn btn-on" onclick="sendPower(true)">ALLUMER</button>
      <button class="btn btn-off" onclick="sendPower(false)">ÉTEINDRE</button>
    </div>
  </div>

  <div class="card">
    <h3>🎨 Couleurs Principales</h3>
    <div class="color-grid">
      <div class="color-btn" style="background: #ff0000;" onclick="sendColor(255, 0, 0)"></div>
      <div class="color-btn" style="background: #00ff00;" onclick="sendColor(0, 255, 0)"></div>
      <div class="color-btn" style="background: #0000ff;" onclick="sendColor(0, 0, 255)"></div>
      <div class="color-btn" style="background: #ffffff;" onclick="sendColor(255, 255, 255)"></div>
      <div class="color-btn" style="background: #ffff00;" onclick="sendColor(255, 255, 0)"></div>
      <div class="color-btn" style="background: #00ffff;" onclick="sendColor(0, 255, 255)"></div>
      <div class="color-btn" style="background: #ff00ff;" onclick="sendColor(255, 0, 255)"></div>
      <div class="color-btn" style="background: #ff7f00;" onclick="sendColor(255, 127, 0)"></div>
    </div>
  </div>

  <div class="card">
    <h3>☀️ Luminosité</h3>
    <input type="range" id="brightness" min="1" max="100" value="100" style="width:100%" oninput="handleBrightnessSlider(this.value)">
  </div>

  <div class="card">
    <h3>⏱️ Minuteur d'extinction</h3>
    <input type="number" id="custom-minutes" placeholder="Durée en minutes (ex: 30)" min="1">
    <button class="btn btn-timer" onclick="startTimerMinutes()">Démarrer le minuteur</button>

    <h3 style="margin-top: 15px;">🕒 Extinction à heure précise</h3>
    <input type="time" id="off-time">
    <button class="btn btn-timer" onclick="startTimerExact()">Programmer l'heure</button>

    <div id="timer-display"></div>
    <button id="cancel-btn" class="btn btn-cancel" style="display:none;" onclick="cancelTimer()">Annuler le minuteur</button>
  </div>

  <div id="night-overlay" onclick="cancelTimer()">
    <h2 id="night-timer">⏳ Extinction en cours...</h2>
    <p>Touchez l'écran pour annuler</p>
  </div>

  <script>
    let savedDevices = { chambre: null, bureau: null, meuble: null };
    let savedCharacteristics = { chambre: null, bureau: null, meuble: null };
    let deviceTypes = { chambre: 'unknown', bureau: 'unknown', meuble: 'unknown' };
    
    let currentZone = null;
    let lastBrightnessTime = 0;
    let activeTimer = null;
    let wakeLock = null;

    const status = document.getElementById('status');
    const timerDisplay = document.getElementById('timer-display');
    const nightOverlay = document.getElementById('night-overlay');
    const nightTimer = document.getElementById('night-timer');
    const forgetBtn = document.getElementById('forget-btn');

    const ALL_SERVICES = [
      '0000ffe0-0000-1000-8000-00805f9b34fb', // LotusLamp
      '0000fff0-0000-1000-8000-00805f9b34fb', // Triones / Keepsmile
      '0000ffd0-0000-1000-8000-00805f9b34fb',
      '0000ff00-0000-1000-8000-00805f9b34fb',
      '0000ae01-0000-1000-8000-00805f9b34fb'
    ];

    async function requestWakeLock() {
      try {
        if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen');
      } catch (err) {}
    }

    function releaseWakeLock() {
      if (wakeLock !== null) { wakeLock.release(); wakeLock = null; }
    }

    async function selectZone(zone) {
      document.querySelectorAll('.btn-zone').forEach(btn => btn.classList.remove('active'));
      document.getElementById(`zone-${zone}`).classList.add('active');
      currentZone = zone;

      if (zone === 'all') {
        status.innerText = "🌐 Mode TOUT (Toutes les zones)";
        status.style.color = "#ff9f1c";
        forgetBtn.style.display = 'none';
        return;
      }

      forgetBtn.style.display = 'inline-block';

      if (savedDevices[zone] && savedDevices[zone].gatt.connected && savedCharacteristics[zone]) {
        status.innerText = `✅ Connecté : ${savedDevices[zone].name || zone.toUpperCase()} (${deviceTypes[zone]})`;
        status.style.color = "#34c759";
        return;
      }

      try {
        if (!savedDevices[zone]) {
          status.innerText = `🔍 Sélectionner le ruban ${zone.toUpperCase()}...`;
          savedDevices[zone] = await navigator.bluetooth.requestDevice({
            acceptAllDevices: true,
            optionalServices: ALL_SERVICES
          });
        }

        status.innerText = `🔗 Connexion en cours...`;
        const server = await savedDevices[zone].gatt.connect();
        const name = (savedDevices[zone].name || '').toUpperCase();
        
        // Détection du protocole selon le nom de la LED
        if (name.includes('KS03') || name.includes('KEEPSMILE') || name.includes('TRIONES') || name.includes('LEDBLE')) {
          deviceTypes[zone] = 'keepsmile';
        } else {
          deviceTypes[zone] = 'lotuslamp';
        }

        const services = await server.getPrimaryServices();
        savedCharacteristics[zone] = null;

        for (const service of services) {
          try {
            const characteristics = await service.getCharacteristics();
            for (const c of characteristics) {
              if (c.properties.writeWithoutResponse || c.properties.write) {
                savedCharacteristics[zone] = c;
                break;
              }
            }
          } catch(e) {}
          if (savedCharacteristics[zone]) break;
        }

        if (savedCharacteristics[zone]) {
          status.innerText = `✅ Connecté : ${name || zone.toUpperCase()} [${deviceTypes[zone].toUpperCase()}]`;
          status.style.color = "#34c759";
        } else {
          throw new Error("Caractéristique introuvable");
        }
      } catch (e) {
        savedDevices[zone] = null;
        savedCharacteristics[zone] = null;
        status.innerText = "❌ Échec de connexion";
        status.style.color = "#e71d36";
      }
    }

    function forgetCurrentZone() {
      if (!currentZone || currentZone === 'all') return;
      if (savedDevices[currentZone] && savedDevices[currentZone].gatt.connected) {
        savedDevices[currentZone].gatt.disconnect();
      }
      savedDevices[currentZone] = null;
      savedCharacteristics[currentZone] = null;
      deviceTypes[currentZone] = 'unknown';
      status.innerText = `🔄 Zone ${currentZone.toUpperCase()} réinitialisée. Cliquez dessus pour ré-appairer.`;
      status.style.color = "#ff9f1c";
    }

    async function writeData(char, bytes) {
      const payload = new Uint8Array(bytes);
      try {
        await char.writeValueWithoutResponse(payload);
      } catch(e) {
        try {
          await char.writeValue(payload);
        } catch(err) {}
      }
    }

    // --- GENERATEURS DE TRAMES PAR MARQUE ---

    function getPowerPayload(zone, state) {
      const type = deviceTypes[zone];
      if (type === 'keepsmile') {
        // Protocole Keepsmile / Triones / KS03
        return [0xcc, state ? 0x23 : 0x24, 0x33];
      } else {
        // Protocole LotusLamp X
        return [0x7e, 0x04, 0x04, state ? 0x01 : 0x00, 0x00, 0x00, 0xef];
      }
    }

    function getColorPayload(zone, r, g, b) {
      const type = deviceTypes[zone];
      if (type === 'keepsmile') {
        // Protocole Keepsmile / Triones (Trame 0x56)
        return [0x56, r, g, b, 0x00, 0xf0, 0xaa];
      } else {
        // Protocole LotusLamp X
        return [0x7e, 0x07, 0x05, 0x03, r, g, b, 0x10, 0xef];
      }
    }

    function getBrightnessPayload(zone, val) {
      const type = deviceTypes[zone];
      if (type === 'keepsmile') {
        // Luminosité pour Triones/Keepsmile (0xaa, level, 0x8b)
        const pct = Math.round((parseInt(val) / 100) * 255);
        return [0xbb, pct, 0x00, 0x44];
      } else {
        // Protocole LotusLamp X
        return [0x7e, 0x04, 0x01, parseInt(val), 0x00, 0x00, 0xef];
      }
    }

    // --- ENVOI DES COMMANDES ---

    async function sendPower(state) {
      if (!currentZone) return alert("Sélectionnez d'abord une zone !");

      if (currentZone === 'all') {
        for (const zone of ['chambre', 'bureau', 'meuble']) {
          if (savedCharacteristics[zone] && savedDevices[zone] && savedDevices[zone].gatt.connected) {
            await writeData(savedCharacteristics[zone], getPowerPayload(zone, state));
          }
        }
      } else {
        if (savedCharacteristics[currentZone] && savedDevices[currentZone] && savedDevices[currentZone].gatt.connected) {
          await writeData(savedCharacteristics[currentZone], getPowerPayload(currentZone, state));
        } else {
          alert("Ruban non connecté.");
        }
      }
    }

    async function sendColor(r, g, b) {
      if (!currentZone) return alert("Sélectionnez d'abord une zone !");

      if (currentZone === 'all') {
        for (const zone of ['chambre', 'bureau', 'meuble']) {
          if (savedCharacteristics[zone] && savedDevices[zone] && savedDevices[zone].gatt.connected) {
            await writeData(savedCharacteristics[zone], getColorPayload(zone, r, g, b));
          }
        }
      } else {
        if (savedCharacteristics[currentZone] && savedDevices[currentZone] && savedDevices[currentZone].gatt.connected) {
          await writeData(savedCharacteristics[currentZone], getColorPayload(currentZone, r, g, b));
        } else {
          alert("Ruban non connecté.");
        }
      }
    }

    function handleBrightnessSlider(val) {
      const now = Date.now();
      if (now - lastBrightnessTime > 50) {
        lastBrightnessTime = now;
        if (!currentZone) return;

        if (currentZone === 'all') {
          for (const zone of ['chambre', 'bureau', 'meuble']) {
            if (savedCharacteristics[zone] && savedDevices[zone] && savedDevices[zone].gatt.connected) {
              writeData(savedCharacteristics[zone], getBrightnessPayload(zone, val));
            }
          }
        } else {
          if (savedCharacteristics[currentZone] && savedDevices[currentZone] && savedDevices[currentZone].gatt.connected) {
            writeData(savedCharacteristics[currentZone], getBrightnessPayload(currentZone, val));
          }
        }
      }
    }

    // --- MINUTEURS ---

    function startCountdown(durationMs) {
      if (activeTimer) clearInterval(activeTimer);
      document.getElementById('cancel-btn').style.display = 'block';

      requestWakeLock();
      nightOverlay.style.display = 'flex';

      const targetTime = Date.now() + durationMs;

      activeTimer = setInterval(() => {
        const remaining = targetTime - Date.now();

        if (remaining <= 0) {
          clearInterval(activeTimer);
          sendPower(false);
          timerDisplay.innerText = "⚡ LEDs éteintes !";
          document.getElementById('cancel-btn').style.display = 'none';
          nightOverlay.style.display = 'none';
          releaseWakeLock();
        } else {
          const m = Math.floor(remaining / 60000);
          const s = Math.floor((remaining % 60000) / 1000);
          const txt = `⏳ Extinction dans ${m}m ${s}s`;
          timerDisplay.innerText = txt;
          nightTimer.innerText = txt;
        }
      }, 1000);
    }

    function startTimerMinutes() {
      const mins = parseInt(document.getElementById('custom-minutes').value);
      if (isNaN(mins) || mins <= 0) return alert("Indiquez une durée valide.");
      startCountdown(mins * 60000);
    }

    function startTimerExact() {
      const timeVal = document.getElementById('off-time').value;
      if (!timeVal) return alert("Sélectionnez une heure.");
      
      const [h, m] = timeVal.split(':');
      const now = new Date();
      const target = new Date();
      target.setHours(parseInt(h), parseInt(m), 0, 0);
      if (target <= now) target.setDate(target.getDate() + 1);
      
      startCountdown(target.getTime() - now.getTime());
    }

    function cancelTimer() {
      if (activeTimer) clearInterval(activeTimer);
      timerDisplay.innerText = "Minuteur annulé.";
      document.getElementById('cancel-btn').style.display = 'none';
      nightOverlay.style.display = 'none';
      releaseWakeLock();
    }
  </script>
</body>
</html>
